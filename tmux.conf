# =======================================================
# 1. 通用基础设置 (General Settings)
# =======================================================
set -g default-terminal 'tmux-256color'
set -s terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:extkeys:hyperlinks,*:RGB:hyperlinks,screen*:title,rxvt*:ignorefkeys'
set -g terminal-overrides 'linux*:AX@,xterm-256color:RGB'
set -s escape-time 0           # Vim 用户必须设为 0，避免 Esc 键延迟
set -s focus-events on
set -s extended-keys on
set -sg exit-empty on
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set-option -g history-limit 10000
set-option -g status-position top
set -g mouse on               # 启用鼠标支持
set -g allow-passthrough on   # 允许 OSC 21 等终端动态颜色/透明度转义序列透传至 Kitty
set -g window-size latest     # 配合单客户端独占会话，避免多端尺寸冲突

# =======================================================
# 2. Google 内部特有体验优化 (非常推荐)
# =======================================================
# 自动重命名窗口为当前的 CitC 客户端名称或目录名
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{?#{m/r:^(/google/src)?/cloud/,#{pane_current_path}},#{s|^(/google/src)?/cloud/[^/]+/([^/]+).+$|\2|:pane_current_path},#{b:pane_current_path}}'

# =======================================================
# 3. 快捷键映射 (Keymaps)
# =======================================================
# 改变前缀键为 Ctrl + Space
unbind C-b
set -g prefix C-Space

# 重载配置快捷键
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# 会话与窗口
bind -n M-s new-session
bind -n M-w new-window  -c "#{pane_current_path}"
bind -n M-b break-pane
bind -n M-o kill-pane -a

# 面板跳转 (Vim 风格)
bind -n M-i select-pane -U
bind -n M-k select-pane -D
bind -n M-j select-pane -L
bind -n M-l select-pane -R

# 调整面板大小 (全面兼容普通 Meta 与 extended-keys 协议下的 Option+Shift 形式)
bind -n M-I   resize-pane -U 5
bind -n M-K   resize-pane -D 5
bind -n M-J   resize-pane -L 5
bind -n M-L   resize-pane -R 5
bind -n M-S-i resize-pane -U 5
bind -n M-S-k resize-pane -D 5
bind -n M-S-j resize-pane -L 5
bind -n M-S-l resize-pane -R 5
bind -n M-S-I resize-pane -U 5
bind -n M-S-K resize-pane -D 5
bind -n M-S-J resize-pane -L 5
bind -n M-S-L resize-pane -R 5

# 支持 Option + 方向键免前缀调整大小
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5

# 同时支持前缀键 (Ctrl + Space) + 方向键 或 大写 IJKL 调整大小 (-r 可连续按)
bind -r Up    resize-pane -U 5
bind -r Down  resize-pane -D 5
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r I     resize-pane -U 5
bind -r K     resize-pane -D 5
bind -r J     resize-pane -L 5
bind -r L     resize-pane -R 5

# 切分面板 (保留当前路径)
bind i split-window -vb -c "#{pane_current_path}"
bind k split-window -v -c "#{pane_current_path}"
bind j split-window -hb -c "#{pane_current_path}"
bind l split-window -h -c "#{pane_current_path}"

# 快速打开速查手册 (右侧优雅圆角悬浮弹窗，按 q 自动关闭，100% 保护分屏布局)
bind ? display-popup -E -w 48% -h 90% -x R -y C -b rounded -T " 📖 速查手册 (CheatSheet) " "cheat --inline"
bind C display-popup -E -w 48% -h 90% -x R -y C -b rounded -T " 📖 速查手册 (CheatSheet) " "cheat --inline"

# 关闭 Session 的弹窗确认
bind S confirm-before -p "Kill session #S ? (y/n)" kill-session

# 快速切换窗口
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Visual 模式 (Vim 风格复制)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# 平滑滚轮翻页速度：将默认的每次 5 行降低为每次 1 行，避免滑动过于灵敏跳跃
bind-key -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind-key -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind-key -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# jsk (Jetski CLI, 进程名 cli) 自己处理滚轮且每格滚好几行；iTerm2 触摸板一划又会发一串事件。
# 对 jsk 面板只转发每 @jsk_wheel_div 个滚轮事件中的 1 个（默认 3，即速度降到 1/3）。
# 其他面板 (nvim / shell) 保持 tmux 默认行为。调速：tmux set -g @jsk_wheel_div 2|3|4
set -g @jsk_wheel_div 3
bind-key -T root WheelUpPane \
  if -F "#{&&:#{==:#{pane_current_command},cli},#{mouse_any_flag}}" \
    { set -pF -t "{mouse}" @jsk_wheel "#{e|%|:#{e|+|:#{?@jsk_wheel,#{@jsk_wheel},0},1},#{@jsk_wheel_div}}" ; \
      if -F -t "{mouse}" "#{==:#{@jsk_wheel},0}" { send-keys -M } } \
    { if -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e } }
bind-key -T root WheelDownPane \
  if -F "#{&&:#{==:#{pane_current_command},cli},#{mouse_any_flag}}" \
    { set -pF -t "{mouse}" @jsk_wheel "#{e|%|:#{e|+|:#{?@jsk_wheel,#{@jsk_wheel},0},1},#{@jsk_wheel_div}}" ; \
      if -F -t "{mouse}" "#{==:#{@jsk_wheel},0}" { send-keys -M } } \
    { send-keys -M }

# 在 jsk 面板里双击文件名（如 init.lua、diff.lua:120）→ 旁边的 nvim 直接打开并跳到对应行。
# 短文件名会从这个 jsk 的对话记录里反查完整路径；双击事件仍然照常转发给 jsk。
bind-key -T root DoubleClick1Pane \
  select-pane -t = \; \
  if -F "#{==:#{pane_current_command},cli}" \
    { run-shell -b -t "{mouse}" "~/.local/bin/jsk-nvim-sync open-ref #{q:mouse_line} #{q:mouse_word} #{pane_id} #{q:mouse_hyperlink} >/dev/null 2>&1" ; \
      if -F "#{mouse_any_flag}" { send-keys -M } } \
    { if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel } }

# =======================================================
# 4. 插件配置 (Plugins)
# =======================================================
set -g status-interval 15     # 状态栏刷新间隔（15秒，降低 SSH 下状态栏频繁重绘与子进程开销）

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Catppuccin Mocha 主题风格 (v2)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# 状态栏右侧胶囊样式 (独立圆角悬浮药丸，无背景黑线)
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "no"

# 先加载 Catppuccin 主题
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

# 状态栏左右配置 (使用静态 Catppuccin 胶囊配色，将每次刷新的外部脚本调用从 8 个精简至 2 个)
set -g status-left ""
set -g status-left-length 100
set -g status-right-length 150
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#[fg=#{@thm_yellow},bg=default]#[fg=#{@thm_crust},bg=#{@thm_yellow}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #($HOME/.config/tmux/plugins/tmux-cpu/scripts/cpu_percentage.sh)#[fg=#{@thm_surface_0},bg=default] "
set -ag status-right "#[fg=#{@thm_yellow},bg=default]#[fg=#{@thm_crust},bg=#{@thm_yellow}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #($HOME/.config/tmux/plugins/tmux-cpu/scripts/ram_percentage.sh)#[fg=#{@thm_surface_0},bg=default] "
# gcert 剩余时间胶囊 (>8h 绿 / 4-8h 黄 / 1-4h 橙 / <1h 或过期 红)
set -ag status-right "#($HOME/.config/tmux/scripts/gcert_status.sh)"
set -ag status-right "#{E:@catppuccin_status_session}"

# =======================================================
# 5. 初始化 TPM (必须放在最末尾！)
# =======================================================
run '~/.config/tmux/plugins/tpm/tpm'

# 覆盖 tmux-sensible 默认的 5 秒刷新间隔，设为 15 秒以减少 SSH 重绘开销
set -g status-interval 15

# 确保状态栏全局透明（与透明终端完美融合，消除整条黑线）
set -g status-style bg=default
set -g status-left-style bg=default
set -g status-right-style bg=default

# 修复 Catppuccin 在透明终端下窗口药丸圆角反色问题（使用原生前景色与透明背景，彻底杜绝 reverse 引起的反色）
set -gF window-status-format "#[fg=#{@thm_surface_0},bg=default]#[fg=#{@thm_fg},bg=#{@thm_surface_0}] ##W #[fg=#{@thm_crust},bg=#{@thm_overlay_2}] ##I#[fg=#{@thm_overlay_2},bg=default]"
set -gF window-status-current-format "#[fg=#{@thm_surface_1},bg=default]#[fg=#{@thm_fg},bg=#{@thm_surface_1}] ##W #[fg=#{@thm_crust},bg=#{@thm_mauve}] ##I#[fg=#{@thm_mauve},bg=default]"

# 开启 OSC 52 剪贴板穿透，打通 SSH 远程终端 / Jetski / Neovim 与本地系统剪贴板
set -s set-clipboard on
set -g allow-passthrough on

# 防止 TPM 默认的 prefix + I (install_plugins) 覆盖面板向上调整快捷键
bind -r I resize-pane -U 5

# =======================================================
# 6. Jetski 友好复制与 Neovim 实时 Diff 联动
# =======================================================
# prefix + y : 弹窗选择代码块 / 完整回复复制;  prefix + Y : 直接复制最后一个代码块
bind y display-popup -E -w 90% -h 85% -b rounded -T " 📋 jsk-yank (Enter 复制) " "~/.local/bin/jsk-yank --pane '#{pane_id}'"
bind Y run-shell -b "~/.local/bin/jsk-yank --last --pane '#{pane_id}' >/dev/null"
# Alt + v (或 prefix + v) : 在当前窗口一键唤起/同步右侧 Neovim 实时 Diff 视图（兼容所有已打开的 jsk 会话）
bind -n M-v run-shell -b "~/.local/bin/jsk-nvim-sync toggle '#{pane_id}' >/dev/null 2>&1"
bind v run-shell -b "~/.local/bin/jsk-nvim-sync toggle '#{pane_id}' >/dev/null 2>&1"
