# =======================================================
# 1. 通用基础设置 (General Settings)
# =======================================================
set -g default-terminal 'tmux-256color'
set -as terminal-features ",*:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 0           # Vim 用户必须设为 0，避免 Esc 键延迟
set -s focus-events on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -sg exit-empty on
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set-option -g history-limit 10000
set-option -g status-position top
set -g mouse on               # 启用鼠标支持

# =======================================================
# 2. Google 内部特有体验优化 (非常推荐)
# =======================================================
# 自动重命名窗口为当前的 CitC 客户端名称或目录名
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{?#{m/r:^(/google/src)?/cloud/,#{pane_current_path}},#{s|^(/google/src)?/cloud/[^/]+/([^/]+).+$|\2|:pane_current_path},#{b:pane_current_path}}'

# =======================================================
# 3. 快捷键映射 (Keymaps)
# =======================================================
# 改变前缀键为 Ctrl + Space
unbind C-b
set -g prefix C-Space

# 重载配置快捷键
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# 会话与窗口
bind -n M-s new-session
bind -n M-w new-window  -c "#{pane_current_path}"
bind -n M-b break-pane
bind -n M-o kill-pane -a

# 面板跳转 (Vim 风格)
bind -n M-i select-pane -U
bind -n M-k select-pane -D
bind -n M-j select-pane -L
bind -n M-l select-pane -R

# 调整面板大小 (Alt + 大写 HJKL)
bind -n M-L resize-pane -R 5
bind -n M-J resize-pane -L 5
bind -n M-K resize-pane -D 5
bind -n M-I resize-pane -U 5

# 切分面板 (保留当前路径)
bind i split-window -vb -c "#{pane_current_path}"
bind k split-window -v -c "#{pane_current_path}"
bind j split-window -hb -c "#{pane_current_path}"
bind l split-window -h -c "#{pane_current_path}"

# 关闭 Session 的弹窗确认
bind S confirm-before -p "Kill session #S ? (y/n)" kill-session

# 快速切换窗口
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Visual 模式 (Vim 风格复制)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# =======================================================
# 4. 插件配置 (Plugins)
# =======================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux'

# Catppuccin Mocha 主题风格 (v2)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# 状态栏左右配置 (Catppuccin 模块)
set -g status-left ""
set -g status-left-length 100
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_session}"

# =======================================================
# 5. 初始化 TPM (必须放在最末尾！)
# =======================================================
run '~/.config/tmux/plugins/tpm/tpm'

