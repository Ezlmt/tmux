# =======================================================
# 1. 通用基础设置 (General Settings)
# =======================================================
set -g default-terminal 'tmux-256color'
set -as terminal-features ",*:RGB"
set -ag terminal-overrides ",xterm-256color:RGB"
set -s escape-time 0           # Vim 用户必须设为 0，避免 Esc 键延迟
set -s focus-events on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -sg exit-empty on
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set-option -g history-limit 10000
set-option -g status-position top
set -g mouse on               # 启用鼠标支持

# =======================================================
# 2. Google 内部特有体验优化 (非常推荐)
# =======================================================
# 自动重命名窗口为当前的 CitC 客户端名称或目录名
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{?#{m/r:^(/google/src)?/cloud/,#{pane_current_path}},#{s|^(/google/src)?/cloud/[^/]+/([^/]+).+$|\2|:pane_current_path},#{b:pane_current_path}}'

# =======================================================
# 3. 快捷键映射 (Keymaps)
# =======================================================
# 改变前缀键为 Ctrl + Space
unbind C-b
set -g prefix C-Space

# 重载配置快捷键
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# 会话与窗口
bind -n M-s new-session
bind -n M-w new-window  -c "#{pane_current_path}"
bind -n M-b break-pane
bind -n M-o kill-pane -a

# 面板跳转 (Vim 风格)
bind -n M-i select-pane -U
bind -n M-k select-pane -D
bind -n M-j select-pane -L
bind -n M-l select-pane -R

# 调整面板大小 (Alt + 大写 HJKL)
bind -n M-L resize-pane -R 5
bind -n M-J resize-pane -L 5
bind -n M-K resize-pane -D 5
bind -n M-I resize-pane -U 5

# 切分面板 (保留当前路径)
bind i split-window -vb -c "#{pane_current_path}"
bind k split-window -v -c "#{pane_current_path}"
bind j split-window -hb -c "#{pane_current_path}"
bind l split-window -h -c "#{pane_current_path}"

# 快速打开速查手册 (右侧优雅圆角悬浮弹窗，按 q 自动关闭，100% 保护分屏布局)
bind ? display-popup -E -w 48% -h 90% -x R -y C -b rounded -T " 📖 速查手册 (CheatSheet) " "cheat --inline"
bind C display-popup -E -w 48% -h 90% -x R -y C -b rounded -T " 📖 速查手册 (CheatSheet) " "cheat --inline"

# 关闭 Session 的弹窗确认
bind S confirm-before -p "Kill session #S ? (y/n)" kill-session

# 快速切换窗口
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Visual 模式 (Vim 风格复制)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# =======================================================
# 4. 插件配置 (Plugins)
# =======================================================
set -g status-interval 5      # 状态栏刷新间隔（5秒）

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Catppuccin Mocha 主题风格 (v2)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# 状态栏右侧胶囊样式 (独立圆角悬浮药丸，无背景黑线)
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "no"

# 先加载 Catppuccin 主题，以便下方使用 -F 展开 CPU/RAM 模块变量
run '~/.config/tmux/plugins/tmux/catppuccin.tmux'

# 修复 Catppuccin CPU/RAM 模块颜色变量未展开的问题（确保脚本输出十六进制色值）
set -gF @cpu_low_fg_color "#{E:@thm_fg}"
set -gF @cpu_medium_fg_color "#{E:@thm_fg}"
set -gF @cpu_high_fg_color "#{E:@thm_crust}"
set -gF @cpu_low_bg_color "#{E:@catppuccin_status_module_text_bg}"
set -gF @cpu_medium_bg_color "#{E:@catppuccin_status_module_text_bg}"
set -gF @cpu_high_bg_color "#{E:@thm_red}"
set -gF @ram_low_fg_color "#{E:@thm_fg}"
set -gF @ram_medium_fg_color "#{E:@thm_fg}"
set -gF @ram_high_fg_color "#{E:@thm_crust}"
set -gF @ram_low_bg_color "#{E:@catppuccin_status_module_text_bg}"
set -gF @ram_medium_bg_color "#{E:@catppuccin_status_module_text_bg}"
set -gF @ram_high_bg_color "#{E:@thm_red}"

# 状态栏左右配置 (Catppuccin 模块)
set -g status-left ""
set -g status-left-length 100
set -g status-right-length 150
set -g status-right "#{E:@catppuccin_status_directory}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"

# =======================================================
# 5. 初始化 TPM (必须放在最末尾！)
# =======================================================
run '~/.config/tmux/plugins/tpm/tpm'

# 确保状态栏全局透明（与透明终端完美融合，消除整条黑线）
set -g status-style bg=default
set -g status-left-style bg=default
set -g status-right-style bg=default

# 修复 Catppuccin 在透明终端下窗口药丸圆角反色问题（使用原生前景色与透明背景，彻底杜绝 reverse 引起的反色）
set -gF window-status-format "#[fg=#{@thm_surface_0},bg=default]#[fg=#{@thm_fg},bg=#{@thm_surface_0}] ##W #[fg=#{@thm_crust},bg=#{@thm_overlay_2}] ##I#[fg=#{@thm_overlay_2},bg=default]"
set -gF window-status-current-format "#[fg=#{@thm_surface_1},bg=default]#[fg=#{@thm_fg},bg=#{@thm_surface_1}] ##W #[fg=#{@thm_crust},bg=#{@thm_mauve}] ##I#[fg=#{@thm_mauve},bg=default]"


